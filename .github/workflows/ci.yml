name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verify release version surfaces
        run: python build/check_version.py

      - name: Scan tracked source for private material
        run: python scripts/privacy_scan.py --repo-root .

      - name: Install hash-locked runtime
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run unit and headless GUI smoke tests
        run: |
          python -m unittest discover -s tests -v
          python fmost_brain_viewer.py --ci-smoke-test
