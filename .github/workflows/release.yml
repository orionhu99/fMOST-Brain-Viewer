name: Windows release

on:
  push:
    branches:
      - main
    paths:
      - version.py
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tag to be contained in main
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:GITHUB_REF_NAME is not contained in origin/main."
          }

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock

      - name: Verify version and tag
        run: python build/check_version.py

      - name: Scan tracked source for private material
        run: python scripts/privacy_scan.py --repo-root .

      - name: Install hash-locked release toolchain
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Run unit and headless GUI smoke tests
        run: |
          python -m unittest discover -s tests -v
          python fmost_brain_viewer.py --ci-smoke-test

      - name: Audit locked runtime dependencies in an isolated environment
        shell: pwsh
        run: |
          $audit = Join-Path $env:RUNNER_TEMP 'viewer-audit-env'
          python -m venv $audit
          $auditPython = Join-Path $audit 'Scripts/python.exe'
          & $auditPython -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not install audit tool.' }
          & $auditPython -m pip_audit -r requirements.lock --no-deps --disable-pip
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed.' }

      - name: Install pinned Inno Setup 6.7.3
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $expected = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup SHA256 mismatch: $actual" }
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER"
          ) -Wait -WindowStyle Hidden -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed." }

      - name: Build portable and installer artifacts
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\build\build_release.ps1 -Python $python -SkipTests -HeadlessSmoke

      - name: Test silent install, frozen app, and uninstall
        shell: pwsh
        run: |
          $version = python build/check_version.py
          $compiler = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6/ISCC.exe'
          & $compiler "/DMyAppVersion=$version" /DTestInstall installer/fmost_brain_viewer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Test installer compilation failed.' }
          $setup = Get-ChildItem ./artifacts/installer-test/*.exe
          ./build/test_installer.ps1 -Installer $setup.FullName -HeadlessSmoke

      - name: Sign release provenance
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.exe
            release/*.zip

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fMOST-Brain-Viewer-win64
          path: |
            release/fMOST-Brain-Viewer-Portable-*-win64.zip
            release/fMOST-Brain-Viewer-Setup-*-win64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release from tag
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python build/check_version.py
          $tag = "v$version"
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must be contained in main.' }
          git rev-parse --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git tag $tag HEAD
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish version tag.' }
          } else {
            $tagCommit = git rev-list -n 1 $tag
            $currentCommit = git rev-parse HEAD
            if ($tagCommit -ne $currentCommit) { throw 'Version tag points to a different commit.' }
          }
          $files = Get-ChildItem .\release -File | Select-Object -ExpandProperty FullName
          if (gh release view $tag 2>$null) {
            throw 'Release already exists; published artifacts are immutable.'
          } else {
            gh release create $tag $files --verify-tag --title "fMOST Brain Viewer $tag" --generate-notes
          }

      - name: Confirm published tag remains contained in main
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Published tag $env:GITHUB_REF_NAME is not contained in origin/main."
          }
